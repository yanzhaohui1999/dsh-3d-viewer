<!doctype html>
<meta charset="utf-8">
<title>dsh-3d-viewer model smoke (STL / GLB)</title>
<style>html,body{margin:0;background:#11161c;color:#c9d4e0;font:13px sans-serif}#root{width:900px;height:560px}#out{padding:4px 8px;margin:0;white-space:pre-wrap}</style>
<div id="root"></div>
<pre id="out">running</pre>
<script>
  window.__errs = [];
  const _ce = console.error, _cw = console.warn;
  console.error = (...a) => { window.__errs.push('E ' + a.map(String).join(' ')); _ce(...a); };
  console.warn = (...a) => { window.__errs.push('W ' + a.map(String).join(' ')); _cw(...a); };
  window.addEventListener('error', e => window.__errs.push('UE ' + (e.message || e.error)));
  window.addEventListener('unhandledrejection', e => window.__errs.push('UR ' + (e.reason && (e.reason.stack || e.reason.message || e.reason))));
</script>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script>
  window.__mods = [];
  window.__ModuleLoader__ = { load({ id, factory }) { window.__mods.push({ id, factory }); } };
</script>
<script src="../lib/client.js"></script>
<script>
// Query modes:
//   ?file=<url>       real file (default ../samples/cube-10mm.stl)
//   ?cube=<size>      generated 12-triangle binary STL cube, edge = size units
//   ?mode=renamed-glb JSON glTF whose buffers[0].uri = "scene.bin", mounted via
//                     a .glb path — the blind-audit bypass. Must be rejected by
//                     the content policy with no network request.
//   ?mode=external-glb A real GLB container whose JSON chunk points at
//                     images[0].uri = "texture.png" — the second blind-audit
//                     hole. Must be rejected with no network request.

// Minimal GLB container around one JSON chunk (no BIN chunk needed).
function glbContainer(json) {
  const raw = new TextEncoder().encode(JSON.stringify(json))
  const padded = new Uint8Array(Math.ceil(raw.length / 4) * 4)
  padded.set(raw)
  padded.fill(0x20, raw.length) // spec: JSON chunk is padded with spaces
  const total = 12 + 8 + padded.byteLength
  const out = new Uint8Array(total)
  const view = new DataView(out.buffer)
  out.set([0x67, 0x6c, 0x54, 0x46]) // 'glTF'
  view.setUint32(4, 2, true)
  view.setUint32(8, total, true)
  view.setUint32(12, padded.byteLength, true)
  view.setUint32(16, 0x4e4f534a, true) // 'JSON'
  out.set(padded, 20)
  return out.buffer
}

// 12-triangle binary STL cube of edge `size`, centred on the origin.
function cubeStl(size) {
  const h = size / 2
  const vertices = [
    [-h, -h, -h], [h, -h, -h], [h, h, -h], [-h, h, -h],
    [-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h],
  ]
  const faces = [
    [0, 3, 2], [0, 2, 1], [4, 5, 6], [4, 6, 7],
    [0, 1, 5], [0, 5, 4], [3, 7, 6], [3, 6, 2],
    [0, 4, 7], [0, 7, 3], [1, 2, 6], [1, 6, 5],
  ]
  const out = new ArrayBuffer(84 + faces.length * 50)
  const view = new DataView(out)
  view.setUint32(80, faces.length, true)
  faces.forEach((face, faceIndex) => {
    const base = 84 + faceIndex * 50
    face.forEach((vertexIndex, corner) => {
      const vertex = vertices[vertexIndex]
      for (let axis = 0; axis < 3; axis += 1) {
        view.setFloat32(base + 12 + corner * 12 + axis * 4, vertex[axis], true)
      }
    })
  })
  return out
}

// Stronger than the old centerPainted sample: count every pixel whose color
// differs from the scene background (#11161c = 17,22,28) plus the strongest
// channel delta. A completely blank canvas scores ~0 and must FAIL; the old
// 8x8 "any channel > 20" threshold PASSed an empty page (review 2026-11-08).
async function pixelStats(canvas) {
  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)))
  const w = canvas.width
  const h = canvas.height
  const copy = document.createElement('canvas')
  copy.width = w
  copy.height = h
  const ctx = copy.getContext('2d')
  ctx.drawImage(canvas, 0, 0)
  const data = ctx.getImageData(0, 0, w, h).data
  let lit = 0
  let maxDelta = 0
  for (let i = 0; i < data.length; i += 4) {
    const delta = Math.max(
      Math.abs(data[i] - 17),
      Math.abs(data[i + 1] - 22),
      Math.abs(data[i + 2] - 28),
    )
    if (delta > 24) lit += 1
    if (delta > maxDelta) maxDelta = delta
  }
  return { lit, total: w * h, ratio: lit / (w * h), maxDelta }
}

function networkHits(needle) {
  const resources = performance.getEntriesByType('resource').map((entry) => entry.name)
  return [...window.__requests, ...resources].filter((url) => String(url).includes(needle))
}
</script>
<script>
(async () => {
  const out = document.getElementById('out')
  const say = (s) => { out.textContent = s; document.title = s.slice(0, 120) }
  window.__requests = []
  try {
    const params = new URLSearchParams(location.search)
    const mode = params.get('mode')
    const cube = Number(params.get('cube'))
    const file = params.get('file') || '../samples/cube-10mm.stl'

    // Every fetch three's FileLoader could issue goes through window.fetch;
    // record it so "rejected with no request" is measured, not assumed.
    const realFetch = window.fetch.bind(window)
    window.fetch = (input, init) => {
      window.__requests.push(String(input && input.url ? input.url : input))
      return realFetch(input, init)
    }

    const entry = window.__mods[0]
    if (!entry) return say('FAIL: bundle never called __ModuleLoader__.load')
    const mod = entry.factory((name) => {
      if (name === 'react') return window.React
      throw new Error('unexpected require: ' + name)
    })
    const caps = { viewers: [] }
    const ctx = {
      effect(fn) { return fn() },
      inject(deps, cb) { cb(ctx) },
      slots: { inject(name, cb) { cb({ register: () => () => {} }) }, register: () => () => {} },
      documentPreviews: { register: () => () => {} },
      betterSidebar: { registerFileViewer: (d) => { caps.viewers.push(d); return () => {} } },
      console: { warn() {} },
    }
    mod.apply(ctx)
    if (!caps.viewers.length) return say('FAIL: no fileViewer registered')

    let buffer
    let path
    let expectRejected = false
    let rejectNeedle = 'scene.bin'
    if (mode === 'renamed-glb') {
      const doc = {
        asset: { version: '2.0' },
        buffers: [{ uri: 'scene.bin', byteLength: 12 }],
        scenes: [{ nodes: [] }],
        scene: 0,
      }
      buffer = new TextEncoder().encode(JSON.stringify(doc)).buffer
      path = 'renamed-json.glb'
      expectRejected = true
    } else if (mode === 'external-glb') {
      // A valid GLB container: the JSON chunk is what three parses, and its
      // images[].uri would be fetched by loadImageSource.
      buffer = glbContainer({ asset: { version: '2.0' }, images: [{ uri: 'texture.png' }] })
      path = 'external-image.glb'
      expectRejected = true
      rejectNeedle = 'texture.png'
    } else if (Number.isFinite(cube) && cube > 0) {
      buffer = cubeStl(cube)
      path = 'cube-' + cube + 'mm.stl'
    } else {
      const res = await realFetch(file)
      if (!res.ok) return say('FAIL: fetch ' + res.status + ' ' + file)
      buffer = await res.arrayBuffer()
      path = file
    }

    const el = window.React.createElement(caps.viewers[0].component, { customData: { buffer }, path })
    window.ReactDOM.createRoot(document.getElementById('root')).render(el)

    for (let i = 0; i < 120; i++) {
      await new Promise((r) => setTimeout(r, 250))
      const text = (document.getElementById('root').innerText || '').replace(/\s+/g, ' ')
      if (expectRejected) {
        if (/内嵌资源|外部引用/.test(text)) {
          await new Promise((r) => setTimeout(r, 300))
          const hits = networkHits(rejectNeedle)
          if (hits.length) return say('FAIL: rejected but ' + rejectNeedle + ' was requested: ' + hits.join(' '))
          return say('PASS · ' + path + ' rejected by content policy · ' + rejectNeedle + ' requests=0 · ' + text.slice(0, 110))
        }
        if (/(三角面|triangles)/.test(text)) return say('FAIL: rejected sample was accepted: ' + text.slice(0, 160))
      } else if (/(三角面|triangles)/.test(text)) {
        const canvas = document.querySelector('#root canvas')
        if (!canvas) return say('FAIL: no canvas after ready state')
        const stats = await pixelStats(canvas)
        if (!(stats.ratio > 0.005 && stats.maxDelta > 40)) {
          return say('RENDER FAIL · blank canvas · litRatio=' + stats.ratio.toFixed(4)
            + ' maxDelta=' + stats.maxDelta + ' · ' + text.slice(0, 90))
        }
        return say('PASS · ' + path.split('/').pop() + ' · canvas=' + canvas.width + 'x' + canvas.height
          + ' · litRatio=' + stats.ratio.toFixed(4) + ' · maxDelta=' + stats.maxDelta
          + ' · ' + text.slice(0, 90))
      }
      if (!expectRejected && /失败|错误|解析失败|不支持的格式|为空/.test(text)) {
        return say('FAIL: ' + text.slice(0, 200) + ' errs=' + JSON.stringify(window.__errs).slice(0, 300))
      }
    }
    say('TIMEOUT: ' + (document.getElementById('root').innerText || '').slice(0, 80)
      + ' errs=' + JSON.stringify(window.__errs).slice(0, 400))
  } catch (e) {
    say('FAIL ' + (e && e.stack ? e.stack : e))
  }
})()
</script>
